openapi: 3.1.0

info:
  title: CATAPULTE Connect API
  version: 1.0.0
  summary: Billetterie du réseau national de catapultes.
  description: |
    API de **CATAPULTE Connect**, la billetterie grand public du réseau de catapultes
    exploité par l'**Office National des Trajectoires Balistiques (ONTB)**.

    Le transport par catapulte est silencieux, sans moteur et panoramique. Chaque ville
    du réseau dispose d'une catapulte unique, dressée en son centre : on ne voyage donc
    pas de gare à gare mais **de ville à ville**. Une catapulte vise sa cible et lance —
    tous les trajets sont **directs**, sans escale ni correspondance.

    ## Parcours

    La découverte du réseau (villes, trajets) est **publique** : on cherche librement.
    La réservation exige un compte : c'est au moment de créer un panier que
    l'authentification devient nécessaire.

    ```
    recherche -> résultats -> détail -> [connexion] -> panier -> paiement -> billets
    ```

    ## Conventions

    - Les réponses de liste sont des **tableaux nus**, sans enveloppe ni métadonnées.
    - Toutes les erreurs sont servies en `application/problem+json` (RFC 7807).
    - Les durées sont en **minutes**. Les montants sont en euros.
  contact:
    name: ONTB — Direction des Systèmes de Lancement
    email: api@ontb.example
  license:
    name: Usage pédagogique
    identifier: CC-BY-NC-SA-4.0

servers:
  - url: http://localhost:4010
    description: Mock local (Prism)
  - url: https://api.catapulte-connect.ontb.example/v1
    description: Production (fictive)

tags:
  - name: Authentification
    description: Création de compte et obtention des jetons. Public.
  - name: Compte
    description: Profil du voyageur et billets détenus.
  - name: Découverte
    description: Villes desservies et recherche de lancers. Public.
  - name: Panier
    description: Composition et paiement d'une réservation.

# Sécurité par défaut : tout est protégé. Les opérations publiques
# lèvent explicitement cette contrainte avec `security: []`.
security:
  - bearerAuth: []

paths:
  # ==========================================================================
  #  FOURNI — Authentification et profil
  #
  #  Ces quatre opérations sont écrites. Elles ne sont pas là pour être
  #  recopiées, mais pour servir de référence : tout ce dont vous avez besoin
  #  pour écrire le reste s'y trouve déjà au moins une fois.
  #
  #  Allez y chercher : comment on déclare un body, comment on référence un
  #  schéma, comment on ouvre une opération au public, comment on décrit une
  #  réponse d'erreur, comment on documente un paramètre.
  # ==========================================================================

  /auth/register:
    post:
      tags: [Authentification]
      operationId: register
      summary: Ouvrir un dossier voyageur
      description: |
        Crée un compte. L'ONTB ne vérifie pas l'adresse e-mail : la responsabilité
        de sa validité incombe au voyageur, conformément au règlement en vigueur.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Dossier voyageur ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Un dossier existe déjà pour cette adresse.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'https://api.catapulte-connect.ontb.example/errors/email-taken'
                title: Adresse déjà enregistrée
                status: 409
                detail: Un dossier voyageur existe déjà pour bob@example.com.
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/login:
    post:
      tags: [Authentification]
      operationId: login
      summary: Se connecter
      description: |
        Authentifie un voyageur et délivre deux jetons : un jeton d'accès, à présenter
        à chaque appel protégé, et un jeton de renouvellement, qui permet d'en obtenir
        un nouveau sans ressaisir son mot de passe.

        L'ONTB ne propose pas de déconnexion : un jeton d'accès expire de lui-même au
        bout d'une heure.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Jetons délivrés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Identifiants invalides.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
              example:
                type: 'https://api.catapulte-connect.ontb.example/errors/invalid-credentials'
                title: Identifiants invalides
                status: 401
                detail: Adresse e-mail ou mot de passe incorrect.
        '422': { $ref: '#/components/responses/ValidationError' }

  /auth/refresh:
    post:
      tags: [Authentification]
      operationId: refreshToken
      summary: Renouveler le jeton d'accès
      description: |
        Échange un jeton de renouvellement encore valide contre un nouveau jeton d'accès.
        Évite de redemander son mot de passe au voyageur toutes les heures.

        Le jeton de renouvellement, lui, n'est pas renouvelé : au bout de 30 jours, il
        faut repasser par `/auth/login`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Nouveau jeton d'accès délivré.
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken:
                    type: string
                    description: Jeton d'accès, valable 1 heure.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Jeton de renouvellement invalide ou expiré.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422': { $ref: '#/components/responses/ValidationError' }

  /users/me:
    get:
      tags: [Compte]
      operationId: getCurrentUser
      summary: Consulter son dossier voyageur
      description: |
        Retourne le dossier du voyageur connecté, identifié par son jeton d'accès.

        Il n'existe pas d'opération pour consulter le dossier d'un autre voyageur : le
        jeton désigne le titulaire, aucun identifiant ne circule dans le chemin.
      responses:
        '200':
          description: Dossier du voyageur connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ==========================================================================
  #  À VOUS — Le flux de réservation
  #
  #  Tout ce qui suit est à écrire. Le contrat métier distribué en fin de J2
  #  fait foi : c'est lui qui dit quelles opérations existent, ce qu'elles
  #  reçoivent et ce qu'elles renvoient. Les indications ci-dessous ne sont
  #  que des repères — elles ne remplacent pas le contrat métier.
  #
  #  Deux choses à ne pas perdre de vue :
  #    - Le mock tourne déjà (`docker compose up`). Écrivez une opération,
  #      rejouez-la dans Bruno, voyez ce qui sort. N'attendez pas la fin.
  #    - `spectral lint openapi.yaml` doit rester vert. Si le linter râle,
  #      corrigez tout de suite : une erreur en cache trois.
  # ==========================================================================

  /cities:
    get:
      tags: [Découverte]
      operationId: getCities
      summary: Consulter les villes désservies par Catapulte Connect
      description: Renvoie les différentes villes disponibles via le réseau de Catapulte depuis lesquelles un voyageur pourra partir ou bien auxquelles il pourra atterrir.
      parameters:
        - name: search
          in: query
          required: false
          description: Filtre des villes par nom
          schema:
            type: string
          example: mar
        - name: limit
          in: query
          required: false
          description: Nombre maximum de villes retournées.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      security: []
      responses:
        '200':
          description: Liste des villes disponibles et correspondant au filtre de recherche. Tableau vide si aucune ville ne correspond.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/City'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /trips/search:
    post:
      tags: [Découverte]
      operationId: searchTrip
      summary: Rechercher un lancer
      description: |
        Rechercher un lancer reliant une ville de départ à une ville d'arrivée
        à une date donnée et pour un certain nombre de places.Tous les lancers sont
        directs : aucune correspondance, aucun itinéraire composé. Sans lancer
        direct ce jour-là, la liste est vide.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [beginning, ending, date, passengers]
              properties:
                beginning:
                  type: string
                  example: Paris
                ending:
                  type: string
                  example: Brest
                date:
                  type: string
                  format: date
                  example: '2027-02-14'
                passengers:
                  type: integer
                  minimum: 1
                  example: 2
      responses:
        '200':
          description: Résultat de la recherche de lancers envoyé.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TripSummary'
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /trips/{id}:
    get:
      tags: [Découverte]
      operationId: getSingleTrip
      summary: Consulter le détail d'un lancer
      description: |
        Renvoie les informations détaillées d'un lancer après avoir cliqué dessus,
        incluant sa franchise de masse, son modèle de catapulte ainsi que ses
        consignes d'embarquement.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e1f2e9b4c5d-8c9d-4a7b-5e6f-1a2b3c4d
      security: []
      responses:
        '200':
          description: Les détails concernants le lancer séléctionné.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TripDetail'
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /carts:
    post:
      tags: [Panier]
      operationId: createCart
      summary: Ouvrir un panier
      description: |
        Ouvre un panier pour vide pour l'utilisateur.
        L'utilisateur doit être connecté pour ouvrir un panier.
      responses:
        '201':
          description: Nouveau panier ouvert.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401': { $ref: '#/components/schemas/Unauthorized' }

    get:
      tags: [Panier]
      operationId: getCart
      summary: Consulter son panier
      description: |
        Retourne le contenu du panier en cours de l'utilisateur connecté.
        L'utilisateur doit être connecté pour consulter son panier.
        L'utilisateur ne peut pas consulter un autre panier que le sien.
      responses:
        '200':
          description: Panier de l'utilisateur connecté
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
                example: {
                  "id": "0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d",
                  "status": "pending",
                  "lines": [],
                  "totalPrice": 0,
                  "openingDate": "2027-02-14T10:03:00Z"
                }
        '401': { $ref: '#/components/responses/Unauthorized' }
        
  /carts/{id}/items:
    post:
      tags: [Panier]
      operationId: addToCart
      summary: Ajouter un lancer à son panier
      description: |
        Ajoute un lancer au panier de l'utilisateur.
        L'utilisateur doit être connecté pour ajouter un lancer à son panier.
        L'utilisateur ne peut ajouter un lancer qu'à son propre panier.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartItem'
      responses:
        '200':
          description: Le panier de l'utilisateur avec le nouveau lancer ajouté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/schemas/Unauthorized' }
        '403': { $ref: '#/components/schemas/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /carts/{id}/items/{itemId}:
    delete:
      tags: [Panier]
      operationId: deleteCartItem
      summary: Retirer un lancer de son panier
      description: |
        Retire un lancer du panier de l'utilisateur. Si le dit lancer était
        le dernier, le panier disparait.
        L'utilisateur doit être connecté pour supprimer un lancer de son panier.
        L'utilisateur ne peut pas supprimer de lancer d'un autre panier que le
        sien.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d
        - name: itemId
          in: path
          required: true
          schema:
            type: string
          example: 1a2cv34d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
      responses:
        '204':
          description: Le lancer a été retiré du panier.
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/schemas/Unauthorized' }
        '403': { $ref: '#/components/schemas/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /carts/{id}/pay:
    post:
      tags: [Panier]
      operationId: payCart
      summary: Payer son panier
      description: |
        Permet à l'utilisateur de payer les lancers qu'il a enregistré dans
        son panier.
        L'utilisateur doit être connecté pour payer son panier.
        L'utilisateur ne peut pas payer le panier d'un autre utilisateur.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          example: 0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PayRequest'
      responses:
        '201':
          description: La confirmation ou infirmation du paiement de l'utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayResponse'
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/schemas/Unauthorized' }
        '403': { $ref: '#/components/schemas/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /tickets:
    get:
      tags: [Billets]
      operationId: getTickets
      summary: Lister les billets de l'utilisateur
      description: |
        Liste les billets de l'utilisateur connecté. Un billet n'est pas
        nominatif, c'est un droit à embarquer sur un lancer.
        Un billet vaut pour une place.
        L'utilisateur doit être connecté pour voir ses billets.
        Un utilisateur ne peut pas voir les billets d'un autre.
      responses:
        '200':
          description: Les billets de l'utilisateur connecté
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Ticket'
        '401': { $ref: '#/components/schemas/Unauthorized' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Jeton d'accès obtenu via `/auth/login`, à présenter en en-tête :
        `Authorization: Bearer <accessToken>`. Durée de validité : 1 heure.
        Passé ce délai, `/auth/refresh` en délivre un nouveau.

  responses:
    BadRequest:
      description: Corps de requête illisible (JSON malformé).
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'about:blank'
            title: Bad Request
            status: 400
            detail: Syntax error in JSON body.

    Unauthorized:
      description: Authentification requise ou jeton invalide/expiré.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'about:blank'
            title: Unauthorized
            status: 401
            detail: Jeton d'accès absent, invalide ou expiré.

    Forbidden:
      description: La ressource appartient à un autre voyageur.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'https://api.catapulte-connect.ontb.example/errors/not-owner'
            title: Accès refusé
            status: 403
            detail: Ce panier appartient à un autre dossier voyageur.

    NotFound:
      description: Ressource introuvable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
          example:
            type: 'about:blank'
            title: Not Found
            status: 404
            detail: Aucune ressource ne correspond à cet identifiant.

    ValidationError:
      description: |
        Le corps est syntaxiquement valide mais une ou plusieurs valeurs sont refusées.
        À distinguer du `400`, qui signale un JSON illisible.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ValidationProblem'
          example:
            type: 'https://api.catapulte-connect.ontb.example/errors/validation'
            title: Données invalides
            status: 422
            detail: 1 champ est en erreur.
            violations:
              - propertyPath: passengers
                message: Le nombre de places doit être supérieur ou égal à 1.

  schemas:
    # ------------------------------------------------------------ Erreurs (RFC 7807)
    Problem:
      type: object
      description: |
        Format d'erreur normalisé par la **RFC 7807** (`application/problem+json`).
        Toutes les réponses d'erreur de l'API suivent ce schéma.
      required: [title, status]
      properties:
        type:
          type: string
          format: uri
          default: 'about:blank'
          description: URI identifiant le type d'erreur. `about:blank` quand le statut HTTP suffit à la décrire.
        title:
          type: string
          description: Résumé court et stable du problème. Ne varie pas d'une occurrence à l'autre.
        status:
          type: integer
          description: Code de statut HTTP, répété ici pour les clients qui ne lisent que le corps.
        detail:
          type: string
          description: Explication spécifique à **cette** occurrence.
        instance:
          type: string
          format: uri
          description: URI de la ressource concernée.

    ValidationProblem:
      description: Erreur de validation — un `Problem` enrichi du détail des champs fautifs.
      allOf:
        - $ref: '#/components/schemas/Problem'
        - type: object
          properties:
            violations:
              type: array
              description: Liste des champs en faute.
              items:
                type: object
                required: [propertyPath, message]
                properties:
                  propertyPath:
                    type: string
                    description: Chemin du champ fautif dans le corps envoyé.
                  message:
                    type: string
                    description: Raison du rejet, lisible par un humain.

    # ------------------------------------------------------------ Auth
    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: bob@example.com
        password:
          type: string
          format: password
          minLength: 8
          example: correct-horse-battery-staple
        firstName:
          type: string
          example: Bob
        lastName:
          type: string
          example: Morane

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: bob@example.com
        password:
          type: string
          format: password
          example: correct-horse-battery-staple

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    TokenPair:
      type: object
      required: [accessToken, refreshToken]
      properties:
        accessToken:
          type: string
          description: Jeton d'accès, valable 1 heure.
        refreshToken:
          type: string
          description: Jeton de renouvellement, valable 30 jours.

    User:
      type: object
      description: Dossier voyageur. `firstName` et `lastName` sont facultatifs.
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
          example: 1a2b3c4d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        email:
          type: string
          format: email
          example: bob@example.com
        firstName:
          type: string
          example: Bob
        lastName:
          type: string
          example: Morane
        createdAt:
          type: string
          format: date-time
          example: '2027-02-14T10:03:00Z'

    # ==========================================================================
    #  À VOUS — Les schémas du flux de réservation
    #
    #  Les entités ci-dessous sont à définir. On vous donne ce qu'elles sont,
    #  pas ce qu'elles contiennent : le contrat métier de J2 porte les champs,
    #  à vous de les traduire en schémas.
    #
    #  Quelques questions qui valent d'être posées avant d'écrire :
    #    - Qu'est-ce qui est obligatoire, qu'est-ce qui est facultatif ?
    #    - Deux schémas se ressemblent-ils au point que l'un compose l'autre ?
    #    - Une valeur n'a-t-elle qu'un jeu de possibilités connu d'avance ?
    # ==========================================================================

    City:
      type: object
      description: Une ville déservie par le service Catapulte Connect.
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
          example: 0e1f2a3b-8c9d-4a7b-5e6f-1a2b3c4d4c5d
        name:
          type: string
          example: Paris

    TripSummary:
      type: object
      description: Les informations concernant un lancer, telles que l'on peut les voir sur la page de recherche des lancers avant d'en selectionner un
      required: [id, beginning, ending, date, duration, price]
      properties:
        id:
          type: string
          format: uuid
          example: 0e1f2e9b4c5d-8c9d-4a7b-5e6f-1a2b3c4d
        beginning:
          type: string
          example: Paris
        ending:
          type: string
          example: Brest
        date:
          type: string
          format: date
          example: '2027-02-14'
        duration:
          type: integer
          example: 20
        price:
          type: integer
          example: 50
      
    TripDetail:
      description: Les informations détaillées d'un lancer telles que l'on peut les voir après avoir cliqué sur un lancer avant de le réserver
      allOf:
        - $ref: '#/components/schemas/TripSummary'
        - type: object
          required: [massFranchising, catapultModel, boardingInstructions]
          properties:
            massFranchising:
              type: integer
              example: 120
            catapultModel:
              type: string
              example: Torsion
            boardingInstructions:
              type: string
              example: "Merci de garder les bras et les jambes à l'interieur de la nacelle pendant le vol"

    Cart:
      type: object
      description: Le panier de l'utilisateur. Contient les lancers que l'utilisateur doit rêgler
      required: [id, status, lines, totalPrice, openingDate]
      properties:
        id:
          type: string
          format: uuid
          example: 0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d
        status:
          type: string
          enum:
            - pending
            - paid
          default: pending
          example: pending
        lines:
          type: array
          description: Liste des lignes du panier de l'utilisateur
          items:
            $ref: '#/components/schemas/CartItem'
        totalPrice:
          type: integer
          example: 150
        openingDate:
          type: string
          format: date-time
          example: '2027-02-14T10:03:00Z'

    CartItem:
      type: objet
      description: Une ligne dans le panier de l'utilisateur, correspondant à un lancer et un nombre de places
      required: [id, trip, travelersNumber, subTotalPrice]
      properties:
        id:
          type: string
          format: uuid
          example: 1a2cv34d-5e6f-4a7b-8c9d-0e1f2a3b4c5d
        trip:
          type: string
          example: 0e1f2n9b4c5d-8c9d-4a7b-5e6f-1a2b3c4d
        travelersNumber: 
          type: integer
          example: 3
        subTotalPrice:
          type: integer
          example: 50

    Ticket:
      type: object
      description: Un droit à embarquer sur un lancer, émis au paiement. Un par place
      required: [id, trip, paidPrice, releaseDate]
      properties:
        id:
          type: string
          format: uuid
          example: 1a2ce34d-5e6f-4a7b-8c9d-0e1hea3b4c5d
        trip:
          type: string
          example: 0e1f2n9b4c5d-8c9d-4a7b-5e6f-1a2b3c4d
        paidPrice:
          type: integer
          example: 150
        releaseDate:
          type: string
          format: date-time
          example: '2027-02-14T10:15:00Z'
    
    PayRequest:
      type: object
      description: Les informations de paiement du panier de l'utilisateur connecté
      required: [id, cart, price, paymentMethod]
      properties:
        id:
          type: string
          format: uuid
          example: 1a2ce84d-5e6f-4a7b-8c9d-0e1hea3b4c5d
        cart:
          type: string
          example: 0e1f2a3b4c5d-8c9d-4a7b-5e67-1a2b3c4d
        price:
          type: integer
          minimum: 1
          example: 150
        paymentMethod:
          type: string
          enum:
            - card
            - voucher
          default: card
          example: card
    PayResponse:
      type: object
      description: La réponse suite au paiement du panier de l'utilisateur connecté
      required: [id, paymentConfirmed]
      properties:
        id:
          type: string
          format: uuid
          example: 0e1f2a7b4c5d-8c9d-4a7b-5e67-1a2b3c4d
        paymentConfirmed:
          type: boolean
          example: true
